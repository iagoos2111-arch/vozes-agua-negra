{% extends "base.html" %}


{% block conteudo %}


<section class="secao estreita">

    <span class="rotulo">
        QUIZ
    </span>

    <h1>
        O que ficou do percurso?
    </h1>

    <p class="introducao">
        Agora é hora de voltar pelo caminho percorrido
        e perceber o que ficou da leitura.
    </p>


    <!--
    method="POST" envia as respostas para o Python.
    -->
    <form
        method="POST"
        id="formQuiz"
    >

        <!--
        O Flask repetirá este bloco para cada
        questão cadastrada no banco.
        -->
        {% for questao in questoes %}

        <fieldset class="questao">

            <legend>
                {{ loop.index }}.
                {{ questao["enunciado"] }}
            </legend>


            <label>

                <input
                    type="radio"
                    name="q{{ questao['id'] }}"
                    value="A"
                >

                <span>
                    <strong>A)</strong>
                    {{ questao["alternativa_a"] }}
                </span>

            </label>


            <label>

                <input
                    type="radio"
                    name="q{{ questao['id'] }}"
                    value="B"
                >

                <span>
                    <strong>B)</strong>
                    {{ questao["alternativa_b"] }}
                </span>

            </label>


            <label>

                <input
                    type="radio"
                    name="q{{ questao['id'] }}"
                    value="C"
                >

                <span>
                    <strong>C)</strong>
                    {{ questao["alternativa_c"] }}
                </span>

            </label>


            <label>

                <input
                    type="radio"
                    name="q{{ questao['id'] }}"
                    value="D"
                >

                <span>
                    <strong>D)</strong>
                    {{ questao["alternativa_d"] }}
                </span>

            </label>

        </fieldset>

        {% endfor %}


        <button
            class="botao"
            type="submit"
        >
            Corrigir respostas
        </button>

    </form>

</section>


{% endblock %}
