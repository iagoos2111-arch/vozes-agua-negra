<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vozes de Água Negra</title>

    <!--
    Liga a página ao arquivo CSS.
    O url_for será interpretado futuramente pelo Flask.
    -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='estilo.css') }}"
    >
</head>

<body>

    <header>

        <div class="limite cabecalho">

            <a
                class="marca"
                href="{{ url_for('inicio') }}"
            >
                Vozes de Água Negra
            </a>

            <nav>

                <a href="{{ url_for('inicio') }}">
                    Conhecer
                </a>

                <a href="{{ url_for('quiz') }}">
                    Quiz
                </a>

                <a href="{{ url_for('participar') }}">
                    Participar
                </a>

                <a href="{{ url_for('painel') }}">
                    Painel
                </a>

            </nav>

        </div>

    </header>


    <main class="limite">

        <!--
        Cada página colocará seu conteúdo
        dentro deste espaço.
        -->
        {% block conteudo %}
        {% endblock %}

    </main>


    <footer>

        <p>
            Projeto do 2º ano de Desenvolvimento de Sistemas
        </p>

        <p>
            Literatura, Educação Étnico-Racial e Informática
        </p>

    </footer>


    <!-- Liga as páginas ao arquivo JavaScript. -->
    <script
        src="{{ url_for('static', filename='script.js') }}"
    >
    </script>

</body>

</html>
